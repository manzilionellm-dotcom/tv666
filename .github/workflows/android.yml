name: Build Android TV APK

# Compile l'APK Black Seven TV (wrapper Capacitor) sur un runner GitHub
# (SDK Android + réseau disponibles) et la publie en Release -> lien de
# téléchargement permanent.

on:
  workflow_dispatch:
  push:
    branches: [claude/tv-app-design-2eevo4]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Export statique de l'app (génère out/)
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Synchroniser Capacitor (copie out/ dans l'APK)
        run: npx cap sync android

      - name: Compiler l'APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk black-seven-tv.apk

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-seven-tv-apk
          path: black-seven-tv.apk

      - name: Héberger l'APK sur un lien public permanent (téléchargeable sur la TV)
        run: |
          UA="black7tv-ci"
          echo "Upload vers catbox.moe (permanent)…"
          URL=$(curl -fsS -H "User-Agent: $UA" -F "reqtype=fileupload" -F "fileToUpload=@black-seven-tv.apk" https://catbox.moe/user/api.php || true)
          case "$URL" in https://*) ;; *) URL="" ;; esac
          if [ -z "$URL" ]; then
            echo "catbox a échoué, essai 0x0.st…"
            URL=$(curl -fsS -H "User-Agent: $UA" -F "file=@black-seven-tv.apk" https://0x0.st || true)
            case "$URL" in https://*) ;; *) URL="" ;; esac
          fi
          if [ -z "$URL" ]; then
            echo "0x0.st a échoué, essai tmpfiles.org (≈1h)…"
            RAW=$(curl -fsS -F "file=@black-seven-tv.apk" https://tmpfiles.org/api/v1/upload | sed -n 's/.*"url":"\([^"]*\)".*/\1/p' || true)
            URL=$(echo "$RAW" | sed 's#tmpfiles.org/#tmpfiles.org/dl/#')
          fi
          echo "APK_PUBLIC_URL=$URL"
          {
            echo "## 📥 Télécharger l'APK Black Seven TV"
            echo ""
            echo "**Lien public (TV / Downloader) :** $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier la Release (archive, non bloquant)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest black-seven-tv.apk \
            --target "$GITHUB_SHA" \
            --title "Black Seven TV — APK Android TV" \
            --notes "APK Android TV autonome (debug, sideload)."
