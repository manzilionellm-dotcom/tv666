name: Build Android TV APK

# Compile l'APK Black Seven TV (wrapper Capacitor) sur un runner GitHub
# (SDK Android + réseau disponibles) et la publie en Release -> lien de
# téléchargement permanent.

on:
  workflow_dispatch:
  push:
    branches: [claude/tv-app-design-2eevo4]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Export statique de l'app (génère out/)
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Synchroniser Capacitor (copie out/ dans l'APK)
        run: npx cap sync android

      - name: Compiler l'APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk black-seven-tv.apk

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-seven-tv-apk
          path: black-seven-tv.apk

      - name: Héberger l'APK sur un lien public (téléchargeable sur la TV)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          URL=""
          # catbox.moe (permanent) — 3 tentatives
          for i in 1 2 3; do
            echo "catbox.moe, tentative $i…"
            R=$(curl -sS -A "$UA" -F "reqtype=fileupload" -F "fileToUpload=@black-seven-tv.apk" https://catbox.moe/user/api.php || true)
            case "$R" in https://*) URL="$R"; break ;; *) echo "  -> $R"; sleep 3 ;; esac
          done
          # litterbox (72h) en repli
          if [ -z "$URL" ]; then
            echo "litterbox (72h)…"
            R=$(curl -sS -A "$UA" -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@black-seven-tv.apk" https://litterbox.catbox.moe/resources/internals/api.php || true)
            case "$R" in https://*) URL="$R" ;; esac
          fi
          # 0x0.st en repli
          if [ -z "$URL" ]; then
            echo "0x0.st…"
            R=$(curl -sS -A "$UA" -F "file=@black-seven-tv.apk" https://0x0.st || true)
            case "$R" in https://*) URL="$R" ;; esac
          fi
          # tmpfiles (≈1h) en dernier recours
          if [ -z "$URL" ]; then
            echo "tmpfiles.org (≈1h)…"
            RAW=$(curl -sS -F "file=@black-seven-tv.apk" https://tmpfiles.org/api/v1/upload | sed -n 's/.*"url":"\([^"]*\)".*/\1/p' || true)
            [ -n "$RAW" ] && URL=$(echo "$RAW" | sed 's#tmpfiles.org/#tmpfiles.org/dl/#')
          fi
          echo "APK_PUBLIC_URL=$URL"
          {
            echo "## 📥 Télécharger l'APK Black Seven TV"
            echo ""
            echo "**Lien public (TV / Downloader) :** $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier la Release (archive, non bloquant)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest black-seven-tv.apk \
            --target "$GITHUB_SHA" \
            --title "Black Seven TV — APK Android TV" \
            --notes "APK Android TV autonome (debug, sideload)."
