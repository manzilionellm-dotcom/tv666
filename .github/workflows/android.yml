name: Build Android TV APK

# Compile l'APK Black Seven TV (wrapper Capacitor) sur un runner GitHub
# (SDK Android + réseau disponibles) et la publie en Release -> lien de
# téléchargement permanent.

on:
  workflow_dispatch:
  push:
    branches: [claude/tv-app-design-2eevo4]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Export statique de l'app (génère out/)
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Synchroniser Capacitor (copie out/ dans l'APK)
        run: npx cap sync android

      - name: Compiler l'APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk black-seven-tv.apk

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-seven-tv-apk
          path: black-seven-tv.apk

      - name: Publier la Release (lien permanent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest black-seven-tv.apk \
            --target "$GITHUB_SHA" \
            --title "Black Seven TV — APK Android TV" \
            --notes "APK Android TV autonome (debug, sideload). App bundlée — parle directement au serveur Xtream (aucun hébergement requis). Installable via Downloader (AFTVnews) ou adb install."
