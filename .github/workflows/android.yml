name: Build Android TV APK

# Compile l'APK autonome (export statique + Capacitor) sur un runner GitHub,
# la publie en Release (tag `latest`) -> lien de téléchargement direct, et
# l'héberge aussi sur un lien public temporaire.

on:
  workflow_dispatch:
  push:
    branches: [claude/tv-app-design-2eevo4]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Export statique de l'app (génère out/)
        env:
          NEXT_PUBLIC_BUILD: ${{ github.run_number }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Synchroniser Capacitor (copie out/ dans l'APK)
        run: npx cap sync android

      - name: Compiler l'APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk 7motion.apk

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7motion-apk
          path: 7motion.apk

      - name: Publier la Release (tag latest)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest 7motion.apk \
            --target "$GITHUB_SHA" \
            --title "7Motion TV — APK Android TV" \
            --notes "APK Android TV autonome (debug, sideload). Lien direct : releases/download/latest/7motion.apk"

      - name: Héberger l'APK sur un lien public temporaire (repli)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          URL=""
          echo "litterbox (72h)…"
          R=$(curl -sS -A "$UA" -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@7motion.apk" https://litterbox.catbox.moe/resources/internals/api.php || true)
          case "$R" in https://*) URL="$R" ;; esac
          if [ -z "$URL" ]; then
            R=$(curl -sS -A "$UA" -F "file=@7motion.apk" https://0x0.st || true)
            case "$R" in https://*) URL="$R" ;; esac
          fi
          echo "APK_PUBLIC_URL=$URL"
          {
            echo "## 📥 Télécharger l'APK"
            echo ""
            echo "**Lien GitHub direct (si repo public) :** https://github.com/manzilionellm-dotcom/tv666/releases/download/latest/7motion.apk"
            echo ""
            echo "**Lien public temporaire (72h) :** $URL"
          } >> "$GITHUB_STEP_SUMMARY"
